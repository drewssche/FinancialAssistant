<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ФинАсист</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2" />
  <link rel="stylesheet" href="/static/styles.css?v=20260904b" />
  </head>
  <body>
    <div id="loginScreen" class="login-screen">
      <section class="login-card">
        <div id="loginLoading" class="login-loading" role="status" aria-live="polite">
          <div class="login-brand-motion" aria-hidden="true">
            <img class="login-brand-mark" src="/static/favicon.svg?v=2" alt="" width="52" height="52" />
          </div>
          <strong>ФинАсист</strong>
          <span>Проверяем сессию...</span>
        </div>
        <div id="loginContent" class="login-content hidden">
          <img class="login-brand-mark" src="/static/favicon.svg?v=2" alt="" width="52" height="52" />
          <h1>ФинАсист</h1>
          <p>Войдите, чтобы продолжить работу.</p>

          <div class="login-actions">
            <button id="telegramLoginBtn" class="btn btn-primary">Войти через Telegram</button>
          </div>
          <div id="telegramBrowserLoginWrap" class="telegram-browser-login hidden">
            <div id="telegramBrowserLogin" class="telegram-browser-login-widget"></div>
            <a id="telegramMiniAppLink" class="btn btn-secondary telegram-mini-app-link hidden" href="#" target="_blank" rel="noopener noreferrer">
              Открыть Mini App в Telegram
            </a>
          </div>
          <div id="loginTelegramHint" class="login-alert is-info hidden" role="status" aria-live="polite"></div>
          <div id="loginAlert" class="login-alert hidden" role="status" aria-live="polite"></div>
        </div>
      </section>
    </div>

    <div id="appShellRoot"></div>

    <div id="modalRoot"></div>

    <div id="toastArea" class="toast-area"></div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/static/js/app-manifest.js?v=20260904b"></script>
    <script src="/static/js/app-bootstrap.js?v=20260904b"></script>
  </body>
</html>
