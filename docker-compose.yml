name: financialassistant

services:
  app:
    build: .
    container_name: financial_assistant_app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      SECURITY_EVENT_LOG_PATH: /var/log/financialassistant/security.jsonl
    volumes:
      - security_logs:/var/log/financialassistant
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.50
    stop_grace_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    # Preserve the socket peer so only explicit SECURITY_TRUSTED_PROXY_IPS can
    # supply client metadata. Nginx overwrites those headers at the edge.
    command: sh -lc "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers --no-access-log"

  bot:
    build: .
    container_name: financial_assistant_bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.15
    stop_grace_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    command: python scripts/run_telegram_admin_bot.py
    healthcheck:
      # The probe only needs stdlib; avoid site initialization under the 0.15 CPU quota.
      test: ["CMD", "python", "-S", "scripts/check_telegram_bot_health.py"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s

  db:
    image: postgres:16-alpine
    container_name: financial_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
      -c shared_buffers=32MB
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c effective_cache_size=128MB
      -c max_connections=10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 384m
    cpus: 0.30
    shm_size: 32m
    stop_grace_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: financial_assistant_redis
    profiles: ["cache"]
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 32mb --maxmemory-policy allkeys-lru
    mem_limit: 64m
    cpus: 0.10
    stop_grace_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  security_logs:
