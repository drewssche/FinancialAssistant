# Include ONLY inside the finance application's existing proxy location /.
# No delays, bans or rejected requests: these are observation thresholds only.
limit_req_dry_run on;
limit_req zone=fa_auth_observe burst=10 nodelay;
limit_req zone=fa_api_observe burst=40 nodelay;
# Prevent limit_req's generic error log from recording raw URLs/query strings.
# Its info-level diagnostics are suppressed by the error-level location log;
# the bounded application journal receives the status instead.
limit_req_log_level info;
error_log /var/log/nginx/error.log error;
proxy_set_header X-FA-Rate-Observation $limit_req_status;
# X-Real-IP must also be overwritten by the existing proxy config to $remote_addr.
