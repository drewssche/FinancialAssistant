# Install in /etc/nginx/conf.d/ (http context). Keys are empty outside matching
# API paths, so static files, readiness and the companion app are exempt.
map $uri $fa_auth_key {
    default "";
    ~^/api/v1/auth/(telegram(/browser)?|refresh|admin/login|signin|user/login)/?$ $binary_remote_addr;
}
map $uri $fa_api_key {
    default "";
    ~^/api/v1/ $binary_remote_addr;
}
limit_req_zone $fa_auth_key zone=fa_auth_observe:1m rate=10r/m;
limit_req_zone $fa_api_key zone=fa_api_observe:2m rate=10r/s;
